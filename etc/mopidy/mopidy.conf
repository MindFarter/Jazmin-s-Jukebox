# Jazmin's JukeBox - Mopidy configuration
# Installed to /etc/mopidy/mopidy.conf

[core]
restore_state = true

[audio]
mixer = software
mixer_volume = 70
output = autoaudiosink

[http]
# Provides unauthenticated control to devices on the local network.
# Do not forward port 6680 from the internet.
hostname = 0.0.0.0
port = 6680
static_dir =

[file]
media_dirs =
    /mnt/screen-sd|Screen SD
    /var/lib/mopidy/music|Music
follow_symlinks = true
excluded_file_extensions =
    .directory
    .html
    .jpeg
    .jpg
    .log
    .nfo
    .png
    .txt

[local]
media_dirs = /mnt/screen-sd;/var/lib/mopidy/music
scan_flush = false
scan_follow_symlinks = true
excluded_file_extensions =
    .directory
    .html
    .jpeg
    .jpg
    .log
    .nfo
    .png
    .txt

[m3u]
playlists_dir = /var/lib/mopidy/playlists
default_encoding = utf-8
base_dir = /var/lib/mopidy/playlists
default_extension = .m3u8

[tunein]
# Browse live radio from TuneIn via Iris (phone web UI)
filter = stations

[iris]
country = GB
locale = en_GB
